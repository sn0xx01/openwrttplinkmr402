name: Build Archer MR402

on:
  push:
    branches:
      - add-tplink-archer-mr402-v1
  workflow_dispatch:

jobs:
  build_firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Освобождение места на диске
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка пакетов для компиляции
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Обновление фидов и настройка под MR402 + LuCI
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_TARGET_ramips=y" > .config
          echo "CONFIG_TARGET_ramips_mt76x8=y" >> .config
          echo "CONFIG_TARGET_ramips_mt76x8_DEVICE_tplink_archer-mr402-v1=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          make defconfig

      - name: Компиляция прошивки
        run: |
          make download -j8
          make -j$(nproc)

      - name: Выгрузка готовых .bin файлов
        uses: actions/upload-artifact@v4
        with:
          name: mr402-firmware
          path: bin/targets/ramips/mt76x8/*.bin
