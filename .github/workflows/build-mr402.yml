name: Build Archer MR402

on:
  push:
    branches:
      - add-tplink-archer-mr402-v1
  workflow_dispatch:

jobs:
  build_firmware:
    runs-on: ubuntu-22.04
    steps:
      - name: Освобождение места на диске
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка пакетов для компиляции
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Обновление фидов и настройка под MR402
        run: |
          ./scripts/feeds update -a
          git -C feeds/luci fetch --shallow-since="2026-01-01"
          git -C feeds/packages fetch --shallow-since="2026-01-01"
          git -C feeds/luci checkout $(git -C feeds/luci rev-list -n 1 --before="2026-02-20" HEAD)
          git -C feeds/packages checkout $(git -C feeds/packages rev-list -n 1 --before="2026-02-20" HEAD)
          ./scripts/feeds install -a
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_tplink_archer-mr402-v1=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-ru=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_picocom=y
          CONFIG_PACKAGE_kmod-ipsec=y
          CONFIG_PACKAGE_kmod-ipsec4=y
          CONFIG_PACKAGE_strongswan=y
          CONFIG_PACKAGE_strongswan-charon=y
          CONFIG_PACKAGE_strongswan-mod-aes=y
          CONFIG_PACKAGE_strongswan-mod-sha1=y
          CONFIG_PACKAGE_strongswan-mod-sha2=y
          CONFIG_PACKAGE_strongswan-mod-gmp=y
          CONFIG_PACKAGE_strongswan-mod-hmac=y
          CONFIG_PACKAGE_strongswan-mod-kernel-netlink=y
          CONFIG_PACKAGE_strongswan-mod-socket-default=y
          CONFIG_PACKAGE_strongswan-mod-stroke=y
          CONFIG_PACKAGE_strongswan-mod-updown=y
          CONFIG_PACKAGE_strongswan-mod-openssl=y
          EOF
          make defconfig
          grep -E "CONFIG_PACKAGE_(strongswan|kmod-ipsec)" .config
          grep -q "CONFIG_PACKAGE_strongswan=y" .config || (echo "ERROR: strongswan не включился!" && exit 1)


      - name: Компиляция прошивки
        run: |
          make download -j8
          make -j$(nproc) || make -j1 V=s

      - name: Выгрузка готовых .bin и .apk файлов
        uses: actions/upload-artifact@v4
        with:
          name: mr402-firmware
          path: |
            bin/targets/ramips/mt76x8/*.bin
            bin/targets/ramips/mt76x8/packages/*.apk
            bin/packages/mipsel_24kc/packages/*strongswan*.apk
